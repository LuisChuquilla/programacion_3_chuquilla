<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación del DOM</title>
    <script src="dom04-eventos.js" defer></script>
    <style>
        .boton {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>


<body>
    <h1 id="titulo">Eventos del DOM</h1>
    <h2 onclick="alert('Hello desde Inline Onclick')">Eventos Inline</h2>
    <h1>Eventos asociados a una función</h1>
    <button class="boton" id="btn" onclick="mostrarAlerta()">Eventos con función</button>
    <button class="boton" id="btn2" onclick="agregarProducto()">Agregar producto</button>
    <ul id="lista-productos"></ul>
    <h1>Eventos configurados con Listener</h1>
    <button class="boton" id="btn3">Agregar producto desde Listener</button>

    <input id="campo" type="text" placeholder="Escribe algo...">

    <input id="campo_actualizar_parrafo" type="text" placeholder="Escribe para actualizar el párrafo...">
    <p id="cambiar">Texto original del párrafo</p>
</body>
</html>
