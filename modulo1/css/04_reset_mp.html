<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset</title>

    <link rel="stylesheet" href="04_display.css">
</head>

<body>
    <h1 style="color:blueviolet ">BOX MODEL</h1>
    <div class="banner-oferta">🔥 Oferta especial: 20% en laptops </div>
    <div class="etiqueta-nuevo">🔥 Oferta especial: 20% en laptops </div>
    <button class="btn-carrito">Nuevo producto</button>
    <button onclick="toggleMenu()"> Menu </button>
    <div id="menu" class="menu-movil">
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </div>
    <script>
        function toggleMenu(){
            const menu = document.getElementById('menu')
            menu.classList.toggle('activo')
        }
    </script>
</body>

</html>
